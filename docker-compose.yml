services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: chainguard/minio-client:latest-dev
    depends_on:
      - minio
    env_file: ./.env
    volumes:
      - ./cmd/minio_entrypoint.sh:/minio-entrypoint.sh:ro
    entrypoint: ["sh", "/minio-entrypoint.sh"]
    restart: "no"

  app_backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: ./.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  app_frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ./.env
    depends_on:
      app_backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
