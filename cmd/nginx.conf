server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # behind Traefik: never redirect to http://host:8080

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # no $uri/: generate creates one folder per route, which would 301 to a trailing slash
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}